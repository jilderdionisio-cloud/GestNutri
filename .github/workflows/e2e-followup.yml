name: Followup E2E candidate

on:
  pull_request:
    branches: [codex/s2-s3-features]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-postgresql:
    name: Playwright against Django, Vite and PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gestnutri_e2e
          POSTGRES_USER: gestnutri_e2e
          POSTGRES_PASSWORD: gestnutri_e2e
        options: >-
          --health-cmd "pg_isready -U gestnutri_e2e -d gestnutri_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      POSTGRES_DB: gestnutri_e2e
      POSTGRES_USER: gestnutri_e2e
      POSTGRES_PASSWORD: gestnutri_e2e
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      VITE_DATA_MODE: api
      E2E_BASE_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/package-lock.json
      - name: Install backend and migrate PostgreSQL
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python manage.py migrate --noinput
          python ../tests/e2e/seed_e2e.py
      - name: Install frontend and Playwright
        run: |
          npm ci --prefix frontend
          npm ci --prefix tests/e2e
          npx --prefix tests/e2e playwright install --with-deps chromium
      - name: Run browser E2E against real services
        run: |
          (cd backend && python manage.py runserver 127.0.0.1:8000 > ../django-e2e.log 2>&1) &
          (cd frontend && VITE_DATA_MODE=api npm run dev -- --host 127.0.0.1 --port 5173 > ../vite-e2e.log 2>&1) &
          for url in http://127.0.0.1:8000/api/v1/auth/csrf/ http://127.0.0.1:5173/; do
            for attempt in {1..30}; do curl --fail --silent "$url" >/dev/null && break; sleep 1; done
            curl --fail --silent "$url" >/dev/null
          done
          npm test --prefix tests/e2e
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: followup-e2e-artifacts
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            django-e2e.log
            vite-e2e.log
          if-no-files-found: warn
